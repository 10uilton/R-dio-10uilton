<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rádio 10uilton — Toca-Discos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Oswald:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }

    body {
        font-family: 'Oswald', sans-serif;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: #0a0704;
    }

    /* ===== MÓVEL DE MADEIRA ===== */
    .movel {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 2vh 5vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background:
            repeating-linear-gradient(100deg,
                rgba(0,0,0,0.10) 0px, rgba(0,0,0,0.10) 2px,
                rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px),
            repeating-linear-gradient(95deg,
                #6b4226 0px, #5a3720 18px, #713f1f 36px, #4a2c17 54px, #63401f 72px),
            radial-gradient(ellipse at 50% -10%, rgba(255,200,140,0.08), transparent 60%);
        box-shadow: inset 0 0 18vw rgba(0,0,0,0.55);
    }

    .movel::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
        z-index: 3;
    }

    /* luz ambiente quente que acende sobre o móvel quando ligado */
    .luz-ambiente {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 70% 45% at 50% 8%, rgba(255,170,60,0.16), transparent 70%);
        opacity: 0;
        transition: opacity 1.2s ease;
        z-index: 1;
    }
    .luz-ambiente.acesa { opacity: 1; animation: respirar 4s ease-in-out infinite; }
    @keyframes respirar { 0%,100% { opacity: .85; } 50% { opacity: 1; } }

    /* ===== PAINEL LED SUPERIOR ===== */
    .painel-led {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 480px;
        background: linear-gradient(160deg, #3a3a3a, #161616 60%, #050505);
        border: 2px solid #1a1a1a;
        border-radius: 10px;
        padding: 1.4vh 4vw;
        box-shadow:
            0 3px 0 rgba(0,0,0,0.6),
            inset 0 1px 0 rgba(255,255,255,0.08),
            inset 0 -6px 10px rgba(0,0,0,0.5);
    }

    .cabecalho-painel {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: .9vh;
    }

    .marca {
        font-family: 'Righteous', cursive;
        text-align: center;
        color: #d99a3d;
        font-size: clamp(14px, 4.4vw, 22px);
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255,178,60,0.45);
    }

    .piloto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3a0808;
        flex-shrink: 0;
        transition: background .3s, box-shadow .3s;
    }
    .piloto.aceso {
        background: #ff5b3d;
        box-shadow: 0 0 5px 2px rgba(255,91,61,.85);
        animation: piscar 2.4s ease-in-out infinite;
    }
    @keyframes piscar { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

    .visor {
        background: #100b02;
        border-radius: 5px;
        border: 1px solid #2a1c08;
        padding: 7px 6px;
        box-shadow: inset 0 0 12px rgba(255,150,0,0.15);
        overflow: hidden;
    }

    .led-texto {
        font-family: 'Share Tech Mono', monospace;
        text-align: center;
        font-size: clamp(9px, 2.8vw, 14px);
        letter-spacing: 2px;
        color: #ffb100;
        text-shadow: 0 0 6px rgba(255,177,0,0.85), 0 0 14px rgba(255,140,0,0.4);
        white-space: nowrap;
        transition: color .3s, text-shadow .3s;
    }

    .led-off { color: #3a2606 !important; text-shadow: none !important; }

    @keyframes flicker {
        0% { opacity: .2; } 15% { opacity: 1; } 30% { opacity: .3; }
        45% { opacity: 1; } 60% { opacity: .5; } 100% { opacity: 1; }
    }
    .led-texto.piscando { animation: flicker .55s steps(2, end) 1; }

    /* equalizador retrô */
    .equalizador {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 3px;
        height: 14px;
        margin-top: 6px;
    }
    .equalizador span {
        width: 4px;
        height: 20%;
        background: linear-gradient(180deg, #ffce54, #ff7a1a);
        border-radius: 1px;
        transition: height .12s ease;
        opacity: .25;
    }
    .equalizador span.on { opacity: 1; }

    /* ===== PRATOS ===== */
    .pratos {
        position: relative;
        z-index: 2;
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3.6vh;
        padding: .5vh 0;
    }

    .toca-disco {
        position: relative;
        width: min(42vw, 27vh, 220px);
        height: min(42vw, 27vh, 220px);
    }

    /* base metálica do prato — preenche exatamente o container, sem vazar */
    .base-prato {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #4a4a4a, #1c1c1c 55%, #0a0a0a 100%);
        box-shadow:
            0 10px 18px rgba(0,0,0,0.55),
            inset 0 0 0 2px rgba(255,255,255,0.06);
    }

    .feltro {
        position: absolute;
        inset: 5%;
        border-radius: 50%;
        background: radial-gradient(circle, #7a1f1f 0%, #5c1414 70%, #3d0d0d 100%);
        box-shadow: inset 0 0 10px rgba(0,0,0,0.6);
    }

    /* ===== VINIL ===== */
    .vinil {
        position: absolute;
        inset: 10%;
        border-radius: 50%;
        background:
            repeating-radial-gradient(circle at 50% 50%,
                #161616 0px, #161616 2px, #0b0b0b 3px, #0b0b0b 4px),
            radial-gradient(circle at 38% 32%, rgba(255,255,255,0.10), transparent 45%);
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 6px 14px rgba(0,0,0,0.6);
        animation: girar 1.8s linear infinite;
        animation-play-state: paused;
    }
    .vinil.acelerando { animation: girar 3s linear infinite; animation-play-state: running; }
    .vinil.tocando { animation: girar 1.8s linear infinite; animation-play-state: running; }

    .brilho-vinil {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
            transparent 0deg, rgba(255,255,255,0.20) 8deg, transparent 22deg,
            transparent 180deg, rgba(255,255,255,0.12) 190deg, transparent 205deg,
            transparent 360deg);
        opacity: 0;
        transition: opacity .5s;
        animation: girar 1.8s linear infinite;
        animation-play-state: paused;
    }
    .brilho-vinil.ativo { opacity: 1; animation-play-state: running; }

    .rotulo {
        position: absolute;
        inset: 33%;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.3);
    }
    .rotulo svg { width: 100%; height: 100%; }

    .furo-central {
        position: absolute;
        left: 50%; top: 50%;
        width: 3.5%; height: 3.5%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, #444, #000 70%);
        box-shadow: 0 0 3px rgba(0,0,0,0.8);
        z-index: 3;
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    /* ===== BRAÇO / TONEARM — tudo contido dentro do container ===== */
    .base-braco {
        position: absolute;
        top: 1%;
        right: 1%;
        width: 13%;
        height: 13%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #cbb46a, #8a7233 60%, #4c3e17);
        box-shadow: 0 3px 6px rgba(0,0,0,0.6);
        z-index: 5;
    }

    .luz-braco {
        position: absolute;
        top: 3.2%;
        right: 3.2%;
        width: 5%;
        height: 5%;
        border-radius: 50%;
        background: #4a0808;
        z-index: 6;
        transition: background .3s, box-shadow .3s;
    }
    .luz-braco.acesa {
        background: #ff3b30;
        box-shadow: 0 0 6px 2px rgba(255,59,48,0.9), 0 0 14px 4px rgba(255,59,48,0.5);
        animation: piscar 2.6s ease-in-out infinite;
    }

    .braco {
        position: absolute;
        top: 6%;
        right: 6%;
        width: 56%;
        height: 6px;
        transform-origin: 94% 50%;
        transform: rotate(-32deg);
        transition: transform 1s cubic-bezier(.4,1.4,.4,1);
        z-index: 5;
    }
    .braco.pousado { transform: rotate(6deg); }

    .haste {
        width: 100%; height: 100%;
        border-radius: 3px;
        background: linear-gradient(180deg, #e4d59a, #a68a3f 45%, #6b551e);
        box-shadow: 0 2px 3px rgba(0,0,0,0.5);
    }

    .cabecote {
        position: absolute;
        left: -6%; top: -60%;
        width: 16%; height: 220%;
        background: linear-gradient(160deg, #333, #111);
        border-radius: 3px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .agulha {
        position: absolute;
        left: -2%; bottom: -55%;
        width: 3px; height: 55%;
        background: #ddd;
        border-radius: 1px;
    }

    /* brilho/glint na ponta da agulha */
    .glint {
        position: absolute;
        left: -3px; bottom: -58%;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff, rgba(255,255,255,0));
        opacity: 0;
    }
    .braco.pousado.vibrando .glint {
        animation: cintilar 1.8s ease-in-out infinite;
    }
    @keyframes cintilar {
        0%, 80%, 100% { opacity: 0; }
        85% { opacity: .9; }
        90% { opacity: .2; }
        95% { opacity: .8; }
    }

    @keyframes vibrar {
        0%, 100% { transform: rotate(6deg); }
        50% { transform: rotate(7.4deg); }
    }
    .braco.pousado.vibrando { animation: vibrar 0.55s ease-in-out infinite; }

    /* ===== PAINEL DE CONTROLE ===== */
    .controles {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 480px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(160deg, #3a3a3a, #161616 60%, #050505);
        border: 2px solid #1a1a1a;
        border-radius: 12px;
        padding: 1.4vh 5vw;
        box-shadow: 0 3px 0 rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .btn-power {
        width: 52px; height: 52px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        background: radial-gradient(circle at 35% 30%, #dcdcdc, #8c8c8c 55%, #3a3a3a);
        box-shadow: 0 4px 0 #1c1c1c, inset 0 0 0 3px #1a1a1a;
        position: relative;
    }
    .btn-power::after {
        content: "";
        position: absolute;
        inset: 38%;
        border-radius: 50%;
        background: #4a0808;
        transition: background .3s, box-shadow .3s;
    }
    .btn-power.ligado::after {
        background: #ff3b30;
        box-shadow: 0 0 8px 2px rgba(255,59,48,0.9);
        animation: piscar 2.4s ease-in-out infinite;
    }
    .btn-power:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c1c1c, inset 0 0 0 3px #1a1a1a; }

    .grupo-volume { display: flex; gap: 12px; }

    .btn-vol {
        width: 46px; height: 46px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 20px;
        font-weight: bold;
        color: #e4c76a;
        background: linear-gradient(160deg, #8a7233, #4c3e17);
        box-shadow: 0 4px 0 #241d0a, inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .btn-vol:active { transform: translateY(3px); box-shadow: 0 1px 0 #241d0a; }

    .btn-voltar {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        left: 14px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(20,14,4,0.82);
        color: #e4c76a;
        border: 1px solid #4c3e17;
        border-radius: 20px;
        padding: 8px 14px 8px 10px;
        font-family: 'Oswald', sans-serif;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(4px);
    }

    .btn-voltar:active { transform: scale(0.96); }
</style>
</head>
<body>

<button class="btn-voltar" onclick="voltarAoMenu()">← Voltar</button>

<div class="movel">
    <div class="luz-ambiente" id="luzAmbiente"></div>

    <div class="painel-led">
        <div class="cabecalho-painel">
            <span class="piloto" id="piloto1"></span>
            <span class="marca">RÁDIO 10UILTON</span>
            <span class="piloto" id="piloto2"></span>
        </div>
        <div class="visor">
            <div class="led-texto led-off" id="ledDisplay">OFFLINE</div>
            <div class="equalizador" id="equalizador">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <div class="pratos">

        <div class="toca-disco">
            <div class="base-prato"></div>
            <div class="feltro"></div>
            <div class="vinil" id="vinil1">
                <div class="brilho-vinil" id="brilho1"></div>
                <div class="rotulo" id="rotulo1"></div>
            </div>
            <div class="furo-central"></div>
            <div class="base-braco"></div>
            <div class="luz-braco" id="luz1"></div>
            <div class="braco" id="braco1">
                <div class="haste">
                    <div class="cabecote"><div class="agulha"></div><div class="glint"></div></div>
                </div>
            </div>
        </div>

        <div class="toca-disco">
            <div class="base-prato"></div>
            <div class="feltro"></div>
            <div class="vinil" id="vinil2">
                <div class="brilho-vinil" id="brilho2"></div>
                <div class="rotulo" id="rotulo2"></div>
            </div>
            <div class="furo-central"></div>
            <div class="base-braco"></div>
            <div class="luz-braco" id="luz2"></div>
            <div class="braco" id="braco2">
                <div class="haste">
                    <div class="cabecote"><div class="agulha"></div><div class="glint"></div></div>
                </div>
            </div>
        </div>

    </div>

    <div class="controles">
        <button class="btn-power" id="btnPower" onclick="alternarEnergia()" aria-label="Ligar/Desligar"></button>
        <div class="grupo-volume">
            <button class="btn-vol" onclick="mudarVolume(-0.1)">−</button>
            <button class="btn-vol" onclick="mudarVolume(0.1)">+</button>
        </div>
    </div>

</div>

<audio id="playerAudio" src="https://usa3.fastcast4u.com/proxy/radio10uilton?mp=/1" preload="none"></audio>

<script>
    function montarRotulo(elId, corA, corB) {
        const el = document.getElementById(elId);
        el.innerHTML = `
        <svg viewBox="0 0 100 100">
            <defs>
                <path id="curva-${elId}" d="M 50,50 m -34,0 a 34,34 0 1,1 68,0 a 34,34 0 1,1 -68,0" />
                <radialGradient id="grad-${elId}" cx="40%" cy="35%" r="70%">
                    <stop offset="0%" stop-color="${corA}"/>
                    <stop offset="100%" stop-color="${corB}"/>
                </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#grad-${elId})" stroke="#000" stroke-width="1"/>
            <text font-family="Oswald, sans-serif" font-size="8.4" font-weight="700" fill="#f2e6c9" letter-spacing="1.5">
                <textPath href="#curva-${elId}" startOffset="2">RÁDIO 10UILTON • RÁDIO 10UILTON •</textPath>
            </text>
            <circle cx="50" cy="50" r="10" fill="#12100c"/>
        </svg>`;
    }
    montarRotulo('rotulo1', '#c23b2c', '#7a1f16');
    montarRotulo('rotulo2', '#2c6b8a', '#173f52');

    const audio = document.getElementById('playerAudio');
    const btnPower = document.getElementById('btnPower');
    const ledDisplay = document.getElementById('ledDisplay');
    const vinil1 = document.getElementById('vinil1');
    const vinil2 = document.getElementById('vinil2');
    const braco1 = document.getElementById('braco1');
    const braco2 = document.getElementById('braco2');
    const luz1 = document.getElementById('luz1');
    const luz2 = document.getElementById('luz2');
    const brilho1 = document.getElementById('brilho1');
    const brilho2 = document.getElementById('brilho2');
    const luzAmbiente = document.getElementById('luzAmbiente');
    const piloto1 = document.getElementById('piloto1');
    const piloto2 = document.getElementById('piloto2');
    const barrasEq = document.querySelectorAll('#equalizador span');

    let estaLigado = false;
    let intervaloEq = null;

    function alternarEnergia() {
        estaLigado = !estaLigado;

        if (estaLigado) {
            btnPower.classList.add('ligado');
            ledDisplay.classList.remove('led-off');
            ledDisplay.classList.add('piscando');
            ledDisplay.innerText = "CONECTANDO...";
            piloto1.classList.add('aceso');
            luzAmbiente.classList.add('acesa');

            audio.play()
                .then(() => {
                    atualizarLed();
                    ledDisplay.classList.remove('piscando');

                    // braço desce sobre o disco
                    braco1.classList.add('pousado');
                    braco2.classList.add('pousado');

                    // prato acelera gradualmente até a velocidade normal
                    vinil1.classList.add('acelerando');
                    vinil2.classList.add('acelerando');
                    brilho1.classList.add('ativo');
                    brilho2.classList.add('ativo');

                    setTimeout(() => {
                        vinil1.classList.remove('acelerando');
                        vinil2.classList.remove('acelerando');
                        vinil1.classList.add('tocando');
                        vinil2.classList.add('tocando');
                        braco1.classList.add('vibrando');
                        braco2.classList.add('vibrando');
                        luz1.classList.add('acesa');
                        luz2.classList.add('acesa');
                        piloto2.classList.add('aceso');
                    }, 1300);

                    iniciarEqualizador();
                })
                .catch(error => {
                    ledDisplay.classList.remove('piscando');
                    ledDisplay.innerText = "ERRO DE CONEXÃO";
                    console.log("Erro ao reproduzir áudio:", error);
                });
        } else {
            audio.pause();
            btnPower.classList.remove('ligado');
            ledDisplay.classList.add('led-off');
            ledDisplay.innerText = "OFFLINE";
            piloto1.classList.remove('aceso');
            piloto2.classList.remove('aceso');
            luzAmbiente.classList.remove('acesa');

            braco1.classList.remove('pousado', 'vibrando');
            braco2.classList.remove('pousado', 'vibrando');
            vinil1.classList.remove('tocando', 'acelerando');
            vinil2.classList.remove('tocando', 'acelerando');
            brilho1.classList.remove('ativo');
            brilho2.classList.remove('ativo');
            luz1.classList.remove('acesa');
            luz2.classList.remove('acesa');
            pararEqualizador();
        }
    }

    function voltarAoMenu() {
        if (estaLigado) {
            audio.pause();
            estaLigado = false;
            pararEqualizador();
        }
        window.location.href = 'index.html';
    }

    function mudarVolume(valor) {
        if (!estaLigado) return;
        let novoVolume = audio.volume + valor;
        if (novoVolume > 1.0) novoVolume = 1.0;
        if (novoVolume < 0.0) novoVolume = 0.0;
        audio.volume = novoVolume;
        atualizarLed();
    }

    function atualizarLed() {
        let volPercentual = Math.round(audio.volume * 100);
        ledDisplay.innerText = `TOCANDO | VOL: ${volPercentual}%`;
    }

    // Barras de equalizador simuladas (streams externos bloqueiam análise real por CORS)
    function iniciarEqualizador() {
        pararEqualizador();
        intervaloEq = setInterval(() => {
            barrasEq.forEach(b => {
                const altura = 20 + Math.random() * 80;
                b.style.height = altura + '%';
                b.classList.add('on');
            });
        }, 160);
    }
    function pararEqualizador() {
        if (intervaloEq) { clearInterval(intervaloEq); intervaloEq = null; }
        barrasEq.forEach(b => { b.style.height = '20%'; b.classList.remove('on'); });
    }
</script>

</body>
</html>
