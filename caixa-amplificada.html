<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rádio 10uilton</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html, body {
        height: 100%;
        width: 100%;
    }

    body {
        background-color: #0c0c0c;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
    }

    .caixa-som {
        background: linear-gradient(145deg, #1c1c1c, #0d0d0d);
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 3vh 6vw;
        box-shadow: inset 0 0 40px rgba(255,255,255,0.04);
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
    }

    /* Painel Superior / Letreiro */
    .painel-topo {
        background-color: #050505;
        width: 100%;
        max-width: 480px;
        padding: 2.5vh 4vw;
        border-radius: 12px;
        border: 2px solid #222;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
    }

    .marca {
        color: #ff3333;
        font-size: clamp(16px, 5vw, 26px);
        font-weight: bold;
        letter-spacing: 2px;
        text-shadow: 0 0 8px rgba(255, 51, 51, 0.6);
        margin-bottom: 1.5vh;
    }

    .led-digital {
        background-color: #000;
        border: 2px solid #111;
        font-family: 'Courier New', Courier, monospace;
        color: #00ff00;
        font-size: clamp(11px, 3.2vw, 16px);
        padding: 8px;
        border-radius: 5px;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        overflow: hidden;
        white-space: nowrap;
        transition: color 0.3s, box-shadow 0.3s;
    }

    .led-desligado {
        color: #003300 !important;
        text-shadow: none !important;
    }

    /* Os Dois Bocões (Alto-falantes) */
    .alto-falantes {
        display: flex;
        flex-direction: column;
        gap: 2vh;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-height: 0;
        padding: 1.5vh 0;
    }

    .anel-luz {
        position: relative;
        width: min(34vw, 21vh, 195px);
        height: min(34vw, 21vh, 195px);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 6px;
    }

    /* Anel de luz neon que gira e reage ao som */
    .anel-luz::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 0deg, #ff3333, #ff9900, #33ff88, #33aaff, #cc33ff, #ff3333);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        filter: blur(0px);
        transition: opacity 0.4s ease;
        animation: girar 4s linear infinite;
    }

    .anel-luz.ativo::before {
        opacity: var(--glow, 0.5);
        filter: blur(1px);
    }

    @keyframes girar {
        to { transform: rotate(360deg); }
    }

    .bocao {
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #0a0a0a 40%, #1a1a1a 41%, #252525 70%, #000 71%);
        border-radius: 50%;
        border: 5px solid #3a3a3a;
        box-shadow: 0 6px 14px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        z-index: 1;
        transition: box-shadow 0.15s ease, border-color 0.3s;
    }

    .bocao.ativo {
        border-color: #555;
        box-shadow:
            0 6px 14px rgba(0,0,0,0.5),
            0 0 calc(10px + var(--glow, 0) * 30px) calc(2px + var(--glow, 0) * 10px) var(--cor-luz, rgba(255,60,60,0.6));
    }

    .calota-central {
        width: 34%;
        height: 34%;
        background: radial-gradient(circle, #333, #050505);
        border-radius: 50%;
        box-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }

    @keyframes pulsar {
        0% { transform: scale(1); }
        100% { transform: scale(1.03); }
    }

    .pulsando {
        animation: pulsar 0.12s infinite alternate;
    }

    /* Painel de Controles */
    .controles {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 480px;
        background-color: #151515;
        padding: 1.8vh 4vw;
        border-radius: 12px;
        border: 1px solid #252525;
    }

    .btn {
        cursor: pointer;
        border: none;
        font-weight: bold;
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .btn-energia {
        position: relative;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 26%, #322a72 0%, #191248 42%, #0a0620 76%, #150a0c 100%);
        box-shadow:
            0 6px 14px rgba(0,0,0,0.6),
            inset 0 -8px 12px rgba(0,0,0,0.6),
            inset 0 6px 10px rgba(255,255,255,0.12),
            0 0 0 2px rgba(80,25,20,0.7);
        overflow: hidden;
    }

    .btn-energia::before {
        content: "";
        position: absolute;
        top: 9%;
        left: 16%;
        width: 62%;
        height: 26%;
        background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
        border-radius: 50%;
        filter: blur(1.5px);
        transform: rotate(-10deg);
        pointer-events: none;
    }

    .btn-energia svg {
        position: relative;
        z-index: 1;
        width: 46%;
        height: 46%;
        filter: drop-shadow(0 0 3px rgba(70,90,255,0.9));
    }

    .btn-energia:active {
        transform: translateY(3px);
        box-shadow:
            0 2px 6px rgba(0,0,0,0.6),
            inset 0 -8px 12px rgba(0,0,0,0.6),
            inset 0 6px 10px rgba(255,255,255,0.1),
            0 0 0 2px rgba(80,25,20,0.7);
    }

    .btn-energia.ligado {
        box-shadow:
            0 6px 14px rgba(0,0,0,0.6),
            inset 0 -8px 12px rgba(0,0,0,0.5),
            inset 0 6px 10px rgba(255,255,255,0.16),
            0 0 20px 5px rgba(70,90,255,0.7),
            0 0 0 2px rgba(80,25,20,0.7);
    }

    .btn-energia.ligado svg {
        filter: drop-shadow(0 0 9px rgba(90,120,255,1));
    }

    .grupo-volume {
        display: flex;
        gap: 12px;
    }

    .btn-vol {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: linear-gradient(135deg, #444, #222);
        color: #fff;
        font-size: 22px;
        box-shadow: 0 4px 0 #111;
    }

    .btn-vol:active {
        transform: translateY(4px);
        box-shadow: none;
    }

    .btn-voltar {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        left: 14px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(20,20,20,0.8);
        color: #ccc;
        border: 1px solid #2c2c2c;
        border-radius: 20px;
        padding: 8px 14px 8px 10px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        backdrop-filter: blur(4px);
    }

    .btn-voltar:active { transform: scale(0.96); }

    /* ===== TIMER PARA DORMIR ===== */
    .btn-timer {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        right: 14px;
        z-index: 10;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(20,20,20,0.8);
        color: #ccc;
        border: 1px solid #2c2c2c;
        border-radius: 50%;
        cursor: pointer;
        backdrop-filter: blur(4px);
    }
    .btn-timer svg { width: 19px; height: 19px; }
    .btn-timer.ativo {
        border-color: #4d64ff;
        box-shadow: 0 0 8px 2px rgba(77,100,255,0.55);
    }
    .btn-timer:active { transform: scale(0.94); }

    .timer-badge {
        position: absolute;
        bottom: -9px;
        left: 50%;
        transform: translateX(-50%);
        background: #4d64ff;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 8px;
        white-space: nowrap;
        display: none;
    }

    .timer-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(0,0,0,0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .timer-overlay.aberto { display: flex; }

    .timer-modal {
        width: 100%;
        max-width: 320px;
        background: linear-gradient(160deg, #1c1c1c, #0d0d0d);
        border: 1px solid #2c2c2c;
        border-radius: 14px;
        padding: 22px 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .timer-modal h3 {
        color: #ff3333;
        font-size: 16px;
        letter-spacing: 1px;
        font-weight: bold;
        margin-bottom: 4px;
        text-shadow: 0 0 8px rgba(255,51,51,0.5);
    }

    .timer-status {
        font-family: 'Courier New', Courier, monospace;
        color: #999;
        font-size: 12px;
        margin-bottom: 16px;
        min-height: 16px;
    }

    .timer-opcoes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
    }
    .timer-opcoes button {
        padding: 12px 0;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #444, #222);
        color: #fff;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
    }
    .timer-opcoes button:active { transform: scale(0.96); }

    .timer-cancelar {
        width: 100%;
        padding: 10px 0;
        border-radius: 8px;
        border: 1px solid #6b2222;
        background: transparent;
        color: #ff6b6b;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        margin-bottom: 8px;
    }
    .timer-cancelar:disabled {
        opacity: .35;
        cursor: default;
    }

    .timer-fechar {
        width: 100%;
        padding: 10px 0;
        border-radius: 8px;
        border: 1px solid #2c2c2c;
        background: transparent;
        color: #999;
        font-size: 13px;
        cursor: pointer;
    }
</style>
</head>
<body>

    <button class="btn-voltar" onclick="voltarAoMenu()">← Voltar</button>

    <button class="btn-timer" id="btnTimer" onclick="abrirTimerModal()" aria-label="Timer para dormir">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20.5 14.5A8 8 0 1 1 9.5 3.5a6.5 6.5 0 0 0 11 11z" stroke="#ccc" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="timer-badge" id="timerBadge"></span>
    </button>

    <div class="timer-overlay" id="timerOverlay">
        <div class="timer-modal">
            <h3>Timer para Dormir</h3>
            <div class="timer-status" id="timerStatus">Nenhum timer ativo</div>
            <div class="timer-opcoes">
                <button onclick="definirTimer(15)">15 min</button>
                <button onclick="definirTimer(30)">30 min</button>
                <button onclick="definirTimer(45)">45 min</button>
                <button onclick="definirTimer(60)">60 min</button>
                <button onclick="definirTimer(90)">90 min</button>
                <button onclick="definirTimer(120)">120 min</button>
            </div>
            <button class="timer-cancelar" id="btnCancelarTimer" onclick="cancelarTimer(true)" disabled>Cancelar Timer</button>
            <button class="timer-fechar" onclick="fecharTimerModal()">Fechar</button>
        </div>
    </div>

    <div class="caixa-som">

        <div class="painel-topo">
            <div class="marca">RÁDIO 10UILTON</div>
            <div id="ledDisplay" class="led-digital led-desligado">OFFLINE</div>
        </div>

        <div class="alto-falantes">
            <div class="anel-luz" id="anel1">
                <div class="bocao" id="bocao1"><div class="calota-central"></div></div>
            </div>
            <div class="anel-luz" id="anel2">
                <div class="bocao" id="bocao2"><div class="calota-central"></div></div>
            </div>
            <div class="anel-luz" id="anel3">
                <div class="bocao" id="bocao3"><div class="calota-central"></div></div>
            </div>
        </div>

        <div class="controles">
            <button class="btn btn-energia" id="btnPower" onclick="alternarEnergia()" aria-label="Ligar/Desligar">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3v8" stroke="#4d64ff" stroke-width="3" stroke-linecap="round"/>
                    <path d="M7 6.2a7.2 7.2 0 1 0 10 0" stroke="#4d64ff" stroke-width="3" stroke-linecap="round" fill="none"/>
                </svg>
            </button>
            <div class="grupo-volume">
                <button class="btn btn-vol" onclick="mudarVolume(-0.1)">-</button>
                <button class="btn btn-vol" onclick="mudarVolume(0.1)">+</button>
            </div>
        </div>

    </div>

    <audio id="playerAudio" src="https://usa3.fastcast4u.com/proxy/radio10uilton?mp=/1" preload="none"></audio>

    <script>
        const audio = document.getElementById('playerAudio');
        const btnPower = document.getElementById('btnPower');
        const ledDisplay = document.getElementById('ledDisplay');
        const bocao1 = document.getElementById('bocao1');
        const bocao2 = document.getElementById('bocao2');
        const bocao3 = document.getElementById('bocao3');
        const anel1 = document.getElementById('anel1');
        const anel2 = document.getElementById('anel2');
        const anel3 = document.getElementById('anel3');

        let estaLigado = false;
        let intervaloLuz = null;
        let matiz = 0;

        function alternarEnergia() {
            estaLigado = !estaLigado;

            if (estaLigado) {
                btnPower.classList.add('ligado');
                ledDisplay.classList.remove('led-desligado');
                ledDisplay.innerText = "CONECTANDO...";

                audio.play()
                    .then(() => {
                        atualizarLedVolume();
                        bocao1.classList.add('pulsando', 'ativo');
                        bocao2.classList.add('pulsando', 'ativo');
                        bocao3.classList.add('pulsando', 'ativo');
                        anel1.classList.add('ativo');
                        anel2.classList.add('ativo');
                        anel3.classList.add('ativo');
                        iniciarLuzes();
                    })
                    .catch(error => {
                        ledDisplay.innerText = "ERRO DE CONEXÃO";
                        console.log("Erro ao reproduzir áudio:", error);
                    });
            } else {
                audio.pause();
                btnPower.classList.remove('ligado');
                ledDisplay.classList.add('led-desligado');
                ledDisplay.innerText = "OFFLINE";

                bocao1.classList.remove('pulsando', 'ativo');
                bocao2.classList.remove('pulsando', 'ativo');
                bocao3.classList.remove('pulsando', 'ativo');
                anel1.classList.remove('ativo');
                anel2.classList.remove('ativo');
                anel3.classList.remove('ativo');
                pararLuzes();
                cancelarTimer(false);
            }
        }

        function voltarAoMenu() {
            if (estaLigado) {
                audio.pause();
                estaLigado = false;
                pararLuzes();
            }
            window.location.href = 'index.html';
        }

        function mudarVolume(valor) {
            if (!estaLigado) return;
            let novoVolume = audio.volume + valor;
            if (novoVolume > 1.0) novoVolume = 1.0;
            if (novoVolume < 0.0) novoVolume = 0.0;
            audio.volume = novoVolume;
            atualizarLedVolume();
        }

        function atualizarLedVolume() {
            let volPercentual = Math.round(audio.volume * 100);
            ledDisplay.innerText = `LIGADA | VOL: ${volPercentual}%`;
        }

        // Efeito de luzes tipo "VU meter" nos bocões, com cor que muda
        // suavemente. Não usa análise real do fluxo de áudio (streams de
        // rádio geralmente bloqueiam isso por CORS e o som pode ficar mudo),
        // então simulamos um brilho pulsante e reativo para dar a sensação
        // de luzes reais acompanhando a música.
        function iniciarLuzes() {
            pararLuzes();
            intervaloLuz = setInterval(() => {
                matiz = (matiz + 12) % 360;
                const brilho1 = (0.35 + Math.random() * 0.65).toFixed(2);
                const brilho2 = (0.35 + Math.random() * 0.65).toFixed(2);
                const brilho3 = (0.35 + Math.random() * 0.65).toFixed(2);

                bocao1.style.setProperty('--glow', brilho1);
                bocao1.style.setProperty('--cor-luz', `hsla(${matiz}, 90%, 55%, 0.75)`);
                anel1.style.setProperty('--glow', brilho1);

                const matiz2 = (matiz + 120) % 360;
                bocao2.style.setProperty('--glow', brilho2);
                bocao2.style.setProperty('--cor-luz', `hsla(${matiz2}, 90%, 55%, 0.75)`);
                anel2.style.setProperty('--glow', brilho2);

                const matiz3 = (matiz + 240) % 360;
                bocao3.style.setProperty('--glow', brilho3);
                bocao3.style.setProperty('--cor-luz', `hsla(${matiz3}, 90%, 55%, 0.75)`);
                anel3.style.setProperty('--glow', brilho3);
            }, 130);
        }

        function pararLuzes() {
            if (intervaloLuz) {
                clearInterval(intervaloLuz);
                intervaloLuz = null;
            }
        }

        // ===== TIMER PARA DORMIR =====
        const btnTimer = document.getElementById('btnTimer');
        const timerBadge = document.getElementById('timerBadge');
        const timerOverlay = document.getElementById('timerOverlay');
        const timerStatus = document.getElementById('timerStatus');
        const btnCancelarTimer = document.getElementById('btnCancelarTimer');

        let timerTimeoutId = null;
        let timerFimEm = null;
        let timerAtualizacaoId = null;

        function abrirTimerModal() {
            timerOverlay.classList.add('aberto');
            atualizarStatusModal();
        }

        function fecharTimerModal() {
            timerOverlay.classList.remove('aberto');
        }

        function definirTimer(minutos) {
            cancelarTimer(false);
            const ms = minutos * 60 * 1000;
            timerFimEm = Date.now() + ms;

            timerTimeoutId = setTimeout(() => {
                timerTimeoutId = null;
                timerFimEm = null;
                pararAtualizacaoBadge();
                btnTimer.classList.remove('ativo');
                timerBadge.style.display = 'none';
                if (estaLigado) alternarEnergia();
            }, ms);

            btnTimer.classList.add('ativo');
            iniciarAtualizacaoBadge();
            fecharTimerModal();
        }

        function cancelarTimer(fecharModal) {
            if (timerTimeoutId) { clearTimeout(timerTimeoutId); timerTimeoutId = null; }
            timerFimEm = null;
            pararAtualizacaoBadge();
            btnTimer.classList.remove('ativo');
            timerBadge.style.display = 'none';
            if (fecharModal) {
                atualizarStatusModal();
                fecharTimerModal();
            }
        }

        function iniciarAtualizacaoBadge() {
            pararAtualizacaoBadge();
            atualizarBadge();
            timerAtualizacaoId = setInterval(atualizarBadge, 1000);
        }

        function pararAtualizacaoBadge() {
            if (timerAtualizacaoId) { clearInterval(timerAtualizacaoId); timerAtualizacaoId = null; }
        }

        function atualizarBadge() {
            if (!timerFimEm) { timerBadge.style.display = 'none'; return; }
            const restanteMs = Math.max(0, timerFimEm - Date.now());
            const min = Math.floor(restanteMs / 60000);
            const seg = Math.floor((restanteMs % 60000) / 1000);
            timerBadge.textContent = `${min}:${seg.toString().padStart(2, '0')}`;
            timerBadge.style.display = 'block';
            atualizarStatusModal();
        }

        function atualizarStatusModal() {
            if (!timerFimEm) {
                timerStatus.textContent = 'Nenhum timer ativo';
                btnCancelarTimer.disabled = true;
                return;
            }
            const restanteMs = Math.max(0, timerFimEm - Date.now());
            const min = Math.floor(restanteMs / 60000);
            const seg = Math.floor((restanteMs % 60000) / 1000);
            timerStatus.textContent = `Desliga em ${min}:${seg.toString().padStart(2, '0')}`;
            btnCancelarTimer.disabled = false;
        }
    </script>

</body>
</html>
